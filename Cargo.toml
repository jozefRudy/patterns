[package]
name = "patterns"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
askama = { version = "0.16", optional = true }
pastey = { version = "0.2", optional = true }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "time"] }
fastembed = { version = "=6.1.0", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"], optional = true }
lingua = { version = "1.8.0", default-features = false, features = ["english", "french", "german", "spanish", "polish"], optional = true }
# count-only tokenizer access (lock-free) — version pinned to fastembed's
tokenizers = { version = "0.23", default-features = false, optional = true }
ort = { version = "=2.0.0-rc.13", optional = true }

[features]
default = ["llm_cli", "embed", "language"]
llm_cli = ["dep:askama", "dep:pastey", "dep:schemars"]
embed = ["dep:fastembed", "dep:ort", "dep:tokenizers"]
language = ["dep:lingua"]

[dev-dependencies]
libc = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
# style lints not covered by pedantic/nursery; auto-fixable, no false positives
needless_borrow = "deny"

# DENY PANICS
unwrap_used = "deny"
string_slice = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
panic = "deny"
panic_in_result_fn = "deny"
exit = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
unchecked_time_subtraction = "deny"

# Don't Fail Silently - prevent dropped futures and swallowed errors
let_underscore_future = "deny"
map_err_ignore = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
assertions_on_result_states = "deny"

# Don't Do Potentially Incorrect Things with Numbers
float_cmp = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
cast_sign_loss = "deny"
invalid_upcast_comparisons = "deny"

# async
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "deny"          # may be nursery alrea

# Don't Do Bad Things That are Easy to Avoid
rc_mutex = "deny"
dbg_macro = "deny"

# enforce AGENTS.md "no #[allow(clippy::*)]" mechanically
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# reference https://emschwartz.me/your-clippy-config-should-be-stricter/#my-configs

[[test]]
name = "stdin_null"
required-features = ["llm_cli"]

[[test]]
name = "define_prompts"
required-features = ["llm_cli"]

[profile.dev]
# ort/ONNX statically linked into every test binary — full debug info makes
# each rebuild churn GBs; line tables keep backtraces useful at a fraction of the size
debug = "line-tables-only"

[profile.dev.build-override]
# build scripts + proc macros: compiled once (sccache), run on every build
opt-level = 3
